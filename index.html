<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscripción de clientes</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#0f766e;--ac2:#fff;--bd:#e3ded3;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#15181a;--card:#1f2326;--tx:#eceff1;--mu:#9aa4ad;--ac:#2dd4bf;--ac2:#0b1f1d;--bd:#323840;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;background:var(--ac);color:var(--ac2);margin-top:16px;width:100%}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
.ok{text-align:center}
.code{font-size:2.6rem;font-weight:800;letter-spacing:.04em;color:var(--ac)}
.meta{color:var(--mu)}
a.wa{display:block;text-decoration:none;text-align:center;margin-top:16px;padding:12px 18px;border-radius:10px;font-weight:600;background:#25d366;color:#0b2a16}
</style>
</head>
<body>
<main>
  <h1>Inscripción de clientes</h1>
  <p class="sub">Completa tus datos para recibir tu código de cliente y tu número de bolsa.</p>

  <section class="card" id="formCard">
    <label for="nombre">Nombre</label>
    <input id="nombre" autocomplete="given-name">
    <label for="apellidos">Apellidos</label>
    <input id="apellidos" autocomplete="family-name">
    <label for="tel">Número de teléfono</label>
    <input id="tel" type="tel" inputmode="tel" autocomplete="tel">
    <div class="err" id="err"></div>
    <button id="btn">Inscribirme</button>
  </section>

  <section class="card ok" id="result" hidden>
    <div class="meta">¡Listo! Tu código de cliente es</div>
    <div class="code" id="rCode"></div>
    <div id="rBag" style="font-size:1.2rem;font-weight:600"></div>
    <a class="wa" id="waBtn" href="#" target="_blank" rel="noopener">Enviarme mi código por WhatsApp</a>
    <p class="meta">También puedes tomar captura de esta pantalla.</p>
  </section>
</main>

<script>
// 👇 PEGA AQUÍ la URL que te da Google Apps Script al implementar (termina en /exec)
var API_URL = "https://script.google.com/macros/s/AKfycbxQuWCgN5Q1OixRWw-kST1sV_T25wlF-k0M8nDS12PgsYuRHvZTHZnZwWRe82cN_AU/exec";

// Opcional: número de WhatsApp de tu negocio con código de país (ej. "50688887777").
// Si lo dejas vacío, el mensaje se abre en el chat del propio cliente para que lo guarde.
var NEGOCIO_WA = "";
var PAIS = "506"; // Costa Rica

var $ = function(id){return document.getElementById(id)};

$("btn").onclick = async function(){
  var nombre = $("nombre").value.trim(),
      apellidos = $("apellidos").value.trim(),
      tel = $("tel").value.trim();
  $("err").textContent = "";
  if(!nombre || !apellidos || !tel){ $("err").textContent = "Completa todos los campos."; return; }
  if(tel.replace(/\D/g,"").length < 7){ $("err").textContent = "El teléfono no parece válido."; return; }

  $("btn").disabled = true; $("btn").textContent = "Enviando…";
  try{
    var r = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({nombre: nombre, apellidos: apellidos, telefono: tel})
    });
    var d = await r.json();
    if(!d.ok) throw new Error(d.error || "Error");
    $("rCode").textContent = d.codigo;
    $("rBag").textContent = (d.repetido ? "Ya estabas inscrito · " : "") + "Bolsa #" + d.bolsa;
    var t = tel.replace(/\D/g,"");
    var numCliente = t.length === 8 ? PAIS + t : t;
    var msg = "Hola, soy " + nombre + " " + apellidos + ". Mi código de cliente es " +
              d.codigo + " y mi número de bolsa es el #" + d.bolsa + ".";
    $("waBtn").href = "https://wa.me/" + (NEGOCIO_WA || numCliente) + "?text=" + encodeURIComponent(msg);
    $("formCard").hidden = true;
    $("result").hidden = false;
  }catch(e){
    $("err").textContent = "No se pudo completar la inscripción. Intenta de nuevo.";
    $("btn").disabled = false; $("btn").textContent = "Inscribirme";
  }
};
</script>
</body>
</html>
