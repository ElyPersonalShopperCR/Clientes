<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ely&amp;Family Personal Shopper · Inscripción de clientes</title>
<style>
:root{--bg1:#e9dcf7;--bg2:#f6effc;--card:#ffffff;--tx:#2d1b45;--mu:#7a6a90;--ac:#7b3fb0;--ac2:#ffffff;--gold:#c9a227;--bd:#e0d1f1;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,#e4d3f5 100%)}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.logo{background:#fff;border-radius:18px;padding:8px;box-shadow:0 6px 22px rgba(123,63,176,.18);border:1px solid var(--bd);margin-bottom:18px;overflow:hidden}
.logo img{display:block;width:100%;height:auto;border-radius:12px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--ac);text-align:center}
.sub{color:var(--mu);margin:0 0 18px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--gold);border-radius:16px;padding:20px;box-shadow:0 6px 22px rgba(123,63,176,.12)}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input[type=text],input[type=tel]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fbf8fe;color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent;background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.85rem;color:var(--mu)}
.chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ac)}
button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;background:var(--ac);color:var(--ac2);margin-top:18px;width:100%}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6}
.link{background:none;border:0;color:var(--ac);text-decoration:underline;font-weight:600;font-size:.9rem;width:auto;padding:0;margin-top:14px;cursor:pointer}
.center{text-align:center}
button.sec{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
.ok{text-align:center}
.code{font-size:2.6rem;font-weight:800;letter-spacing:.04em;color:var(--ac)}
.meta{color:var(--mu)}
.small{font-size:.8rem}
a.wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;margin-top:16px;padding:13px 18px;border-radius:12px;font-weight:700;background:#25d366;color:#0b2a16}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
footer{margin-top:22px;text-align:center;color:var(--mu);font-size:.85rem}
footer a{color:var(--ac);font-weight:600;text-decoration:none;margin:0 8px}
</style>
</head>

  <h1>Inscripción de clientes</h1>
  <p class="sub">Completa tus datos para recibir tu código de cliente.</p>

  <section class="card" id="formCard">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" autocomplete="given-name">
    <label for="apellidos">Apellidos</label>
    <input type="text" id="apellidos" autocomplete="family-name">
    <label for="tel">Número de teléfono</label>
    <input type="tel" id="tel" inputmode="tel" autocomplete="tel">

    <div class="hp" aria-hidden="true">
      <label for="web">No llenar este campo</label>
      <input type="text" id="web" tabindex="-1" autocomplete="off">
    </div>

    <label class="chk" for="acepto">
      <input type="checkbox" id="acepto">
      <span>Acepto que mis datos (nombre y teléfono) se usen únicamente para gestionar mi bolsa y contactarme.</span>
    </label>

    <div class="err" id="err"></div>
    <button id="btn">Crear mi Código</button>
    <div class="center"><button class="link" id="irConsulta" type="button">Ya me inscribí, ver mi código</button></div>
  </section>

  <section class="card" id="consultCard" hidden>
    <strong>Recuperar mi código</strong>
    <p class="meta small" style="margin:4px 0 0">Escribe el número de teléfono con el que te inscribiste.</p>
    <label for="telC">Número de teléfono</label>
    <input type="tel" id="telC" inputmode="tel" autocomplete="tel">
    <div class="err" id="errC"></div>
    <button id="btnC">Ver mi código</button>
    <div class="center"><button class="link" id="volver" type="button">Volver</button></div>
  </section>

  <section class="card ok" id="result" hidden>
    <div class="meta">¡Listo! Tu código de cliente es</div>
    <div class="code" id="rCode"></div>
    <div id="rBag" style="font-size:1.2rem;font-weight:600"></div>

<script>
// URL de tu Google Apps Script
var API_URL = "https://script.google.com/macros/s/AKfycbxQuWCgN5Q1OixRWw-kST1sV_T25wlF-k0M8nDS12PgsYuRHvZTHZnZwWRe82cN_AU/exec";

// ---- Configuración opcional ----
// WhatsApp de tu negocio con código de país (ej. "50688887777"). Si queda vacío,
// el botón abre el chat del propio cliente para que guarde su código.
var NEGOCIO_WA = "";
// Enlaces de tus redes (déjalos vacíos para ocultarlos). Ej: "https://instagram.com/tuusuario"
var INSTAGRAM = "";
var FACEBOOK = "";
var PAIS = "506"; // Costa Rica
// --------------------------------

var $ = function(id){return document.getElementById(id)};
var t0 = Date.now();

function post(payload){
  return fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  }).then(function(r){return r.json()});
}
function soloDigitos(t){return String(t).replace(/\D/g,"")}
function show(id){["formCard","consultCard","result"].forEach(function(x){$(x).hidden = (x!==id)})}

function mostrarResultado(d, tel, nombreCompleto){
  $("rCode").textContent = d.codigo;
  $("rBag").textContent = "Bolsa #" + d.bolsa;
  var t = soloDigitos(tel);
  var num = t.length === 8 ? PAIS + t : t;
  var msg = "Hola, gracias por unirte a nuestra comunidad. Tu código de cliente es " +
            d.codigo + " y tu número de bolsa es el #" + d.bolsa + ".";
  $("waBtn").href = "https://wa.me/" + (NEGOCIO_WA || num) + "?text=" + encodeURIComponent(msg);
  show("result");
}

// ---- Crear código ----
$("btn").onclick = async function(){
  var nombre = $("nombre").value.trim(),
      apellidos = $("apellidos").value.trim(),
      tel = $("tel").value.trim();
  $("err").textContent = "";
  if(!nombre || !apellidos || !tel){ $("err").textContent = "Completa todos los campos."; return; }
  if(soloDigitos(tel).length < 7){ $("err").textContent = "El teléfono no parece válido."; return; }
  if(!$("acepto").checked){ $("err").textContent = "Debes aceptar el uso de tus datos para continuar."; return; }

  $("btn").disabled = true; $("btn").textContent = "Enviando…";
  try{
    var d = await post({accion:"registrar", nombre:nombre, apellidos:apellidos, telefono:tel,
                        web:$("web").value, t:Date.now()-t0});
    if(d.duplicado){
      $("err").textContent = "Número telefónico ya está en uso, favor intentar nuevamente.";
    } else if(d.limite){
      $("err").textContent = "Hay muchas solicitudes en este momento. Intenta de nuevo en unos minutos.";
    } else if(!d.ok){
      throw new Error(d.error || "Error");
    } else {
      mostrarResultado(d, tel, nombre + " " + apellidos);
    }
  }catch(e){
    $("err").textContent = "No se pudo completar la inscripción. Intenta de nuevo.";
  }
  $("btn").disabled = false; $("btn").textContent = "Crear mi Código";
};

// ---- Volver al inicio ----
$("inicio").onclick = function(){
  ["nombre","apellidos","tel","telC","web"].forEach(function(id){$(id).value = ""});
  $("acepto").checked = false;
  $("err").textContent = ""; $("errC").textContent = "";
  t0 = Date.now();
  show("formCard");
  window.scrollTo(0,0);
};

// ---- Recuperar código ----
$("irConsulta").onclick = function(){ $("errC").textContent=""; show("consultCard"); };
$("volver").onclick = function(){ show("formCard"); };
$("btnC").onclick = async function(){
  var tel = $("telC").value.trim();
  $("errC").textContent = "";
  if(soloDigitos(tel).length < 7){ $("errC").textContent = "Escribe un teléfono válido."; return; }
  $("btnC").disabled = true; $("btnC").textContent = "Buscando…";
  try{
    var d = await post({accion:"consultar", telefono:tel});
    if(d.ok){ mostrarResultado(d, tel, ""); }
    else if(d.noencontrado){ $("errC").textContent = "No encontramos ese número. Verifica que sea el mismo con el que te inscribiste."; }
    else if(d.limite){ $("errC").textContent = "Demasiadas consultas. Intenta de nuevo en unos minutos."; }
    else throw new Error(d.error || "Error");
  }catch(e){
    $("errC").textContent = "No se pudo consultar. Intenta de nuevo.";
  }
  $("btnC").disabled = false; $("btnC").textContent = "Ver mi código";
};

// ---- Redes ----

  var items = [];
  if(NEGOCIO_WA) items.push('<a href="https://wa.me/'+NEGOCIO_WA+'" target="_blank" rel="noopener">WhatsApp</a>');
  if(INSTAGRAM) items.push('<a href="'+INSTAGRAM+'" target="_blank" rel="noopener">Instagram</a>');
  if(FACEBOOK) items.push('<a href="'+FACEBOOK+'" target="_blank" rel="noopener">Facebook</a>');
  $("redes").innerHTML = (items.length ? '<div>Síguenos y escríbenos:<br>'+items.join("")+'</div>' : "") +
                         '<div style="margin-top:8px">Ely&amp;Family Personal Shopper</div>';
})();
</script>
